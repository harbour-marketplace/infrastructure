services:
  customer-postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: customer-postgres
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - customers_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d customers" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  customers_data: